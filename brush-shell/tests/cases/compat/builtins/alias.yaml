name: "Builtins: alias"
cases:
  - name: "Basic alias usage"
    stdin: |
      shopt -s expand_aliases
      alias myalias=echo
      alias
      myalias 'hello'

  - name: "Alias with trailing space"
    stdin: |
      shopt -s expand_aliases
      alias cmd='echo '
      alias other='replaced '
      alias otherother='also-replaced'

      cmd other otherother

  - name: "Alias referencing to alias"
    stdin: |
      shopt -s expand_aliases
      alias myalias=echo
      alias outeralias=myalias
      outeralias 'hello'

  - name: "Alias to keywords"
    stdin: |
      shopt -s expand_aliases
      alias myalias=if
      myalias true; then echo "true"; fi

  - name: "Alias with redirection and pipe"
    stdin: |
      shopt -s expand_aliases
      alias e1='echo hi 2>&1'
      alias pp='echo a | tr a b'
      e1 there
      pp
      e1 2>/dev/null x

  - name: "Alias with quotes and a list"
    stdin: |
      shopt -s expand_aliases
      alias q='echo "two  spaces"; echo next'
      q
      echo q

  - name: "Alias defined on the line it is used on"
    stdin: |
      shopt -s expand_aliases
      alias x1='echo X1'; x1 2>/dev/null || echo not-yet
      x1
